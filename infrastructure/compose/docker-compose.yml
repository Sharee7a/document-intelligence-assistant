services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/Dockerfile
      args:
        INSTALL_DENSE: ${INSTALL_DENSE:-0}
    ports: ["8000:8000"]
    environment:
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      USE_DENSE_EMBEDDINGS: ${USE_DENSE_EMBEDDINGS:-0}
    volumes:
      - document_data:/data
      - embedding_cache:/root/.cache/huggingface
  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  document_data:
  embedding_cache:
