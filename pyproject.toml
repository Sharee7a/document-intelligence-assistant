[project]
name = "document-intelligence-assistant"
version = "0.1.0"
description = "PDF OCR, grounded retrieval, and cited question answering"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.9", "PyMuPDF>=1.24,<2", "scikit-learn>=1.5,<2", "numpy>=1.26,<3", "Pillow>=10,<13", "pytesseract>=0.3.10,<1", "python-dotenv>=1.0,<2"]

[tool.ruff]
line-length = 100
target-version = "py310"